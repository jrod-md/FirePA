name: Public validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Public Python package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install ".[dev]"

      - name: Verify public release package
        run: python scripts/verify_public_release_package.py --package site-data

      - name: Run public Python tests
        run: python -m pytest -q --basetemp=.pytest-tmp-ci

  site:
    name: Astro publication
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build publication
        run: npm run build

      - name: Verify publication contract
        run: npm run test
