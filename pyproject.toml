[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuegopa"
version = "0.1.0"
description = "Data spike reproducible para evaluar escalamiento de eventos FIRMS en Panama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "streamlit==1.41.1"]
gee = ["earthengine-api>=1.7.0"]

[project.scripts]
fuegopa-acquire-firms = "fuegopa.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
